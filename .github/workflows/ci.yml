name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: medilink, POSTGRES_PASSWORD: medilink, POSTGRES_DB: medilink }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medilink" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://medilink:medilink@localhost:5432/medilink?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      OTP_PROVIDER: console
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: pnpm install --no-frozen-lockfile
      # Every check below runs even if an earlier one failed, so one run shows all problems.
      - name: Core tests
        if: always()
        run: pnpm --filter @medilink/core test
      - name: Sync agent tests
        if: always()
        run: pnpm --filter @medilink/sync-agent test
      - name: Database migrate + seed
        if: always()
        run: pnpm --filter @medilink/api prisma:deploy && pnpm --filter @medilink/api prisma:seed
      - name: API typecheck
        if: always()
        shell: bash
        run: set +e +o pipefail; pnpm --filter @medilink/api typecheck 2>&1 | tee /tmp/out.txt; code=${PIPESTATUS[0]}; bash .github/report.sh /tmp/out.txt $code
      - name: API end-to-end test
        if: always()
        shell: bash
        run: set +e +o pipefail; pnpm --filter @medilink/api test 2>&1 | tee /tmp/out.txt; code=${PIPESTATUS[0]}; bash .github/report.sh /tmp/out.txt $code
      - name: API build
        if: always()
        run: pnpm --filter @medilink/api build
      - name: Web typecheck
        if: always()
        shell: bash
        run: set +e +o pipefail; pnpm --filter @medilink/web typecheck 2>&1 | tee /tmp/out.txt; code=${PIPESTATUS[0]}; bash .github/report.sh /tmp/out.txt $code
      - name: Web build
        if: always()
        shell: bash
        run: set +e +o pipefail; pnpm --filter @medilink/web build 2>&1 | tee /tmp/out.txt; code=${PIPESTATUS[0]}; bash .github/report.sh /tmp/out.txt $code
      - name: Mobile typecheck
        if: always()
        shell: bash
        run: set +e +o pipefail; pnpm --filter @medilink/mobile typecheck 2>&1 | tee /tmp/out.txt; code=${PIPESTATUS[0]}; bash .github/report.sh /tmp/out.txt $code

  mobile:
    # Builds Android (AAB) and iOS (IPA) in Expo's cloud on release tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: pnpm install --no-frozen-lockfile
      - run: cd apps/mobile && eas build --platform all --profile production --non-interactive --no-wait
