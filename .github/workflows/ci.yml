name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: medilink, POSTGRES_PASSWORD: medilink, POSTGRES_DB: medilink }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medilink" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://medilink:medilink@localhost:5432/medilink?schema=public
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      OTP_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @medilink/api prisma:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mobile:
    # Builds Android (AAB) and iOS (IPA) in Expo's cloud on release tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: pnpm install --frozen-lockfile=false
      - run: cd apps/mobile && eas build --platform all --profile production --non-interactive --no-wait
