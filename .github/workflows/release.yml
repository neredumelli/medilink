name: Release images
# Builds the four production images and publishes them to GitHub Packages (ghcr.io).
# Tag a release (git tag v0.2.0 && git push --tags), then on the server: scripts/deploy.sh v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ".", file: "apps/api/Dockerfile" }
          - { name: web, context: ".", file: "apps/web/Dockerfile" }
          - { name: caddy, context: "infra/production/caddy", file: "infra/production/caddy/Dockerfile" }
          - { name: postgres, context: "infra/production/postgres", file: "infra/production/postgres/Dockerfile" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/medilink-${{ matrix.name }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/medilink-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
